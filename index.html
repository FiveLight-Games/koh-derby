  for(const p of players)if(!R.order.includes(p.id))R.order.push(p.id);
  while(R.bots.length&&players.length+R.bots.length>MAXP){const b=R.bots.pop();R.order=R.order.filter(i=>i!==b.id)}
  R.order=R.order.filter(id=>players.some(p=>p.id===id)||R.bots.some(b=>b.id===id));dirOpen('host');dirSync()}
 refreshRoom()}
function netTick(dt){if(!net||!ch||!chReady)return;sendAcc+=dt;const play=R&&R.phase==='play',rate=play?1/12:1/3;if(sendAcc<rate)return;sendAcc=0;
 if(!play&&!isHost)return;
 const p={id:myId,cars:play?cars.filter(c=>c.net==='local').map(rec):[],ev:evQ.splice(0)};
 if(isHost){p.room=R;p.hn=Date.now();p.rig=rigRec(TRK).concat(rigRec(TRL),[r3(TK.steer)])}

// ---------- lobby list: hosts advertise their lobby on a shared presence channel ----------

function dirOpen(mode){

 const d=dir;d.subscribe(s=>{if(d!==dir)return;if(s==='SUBSCRIBED'){dirReady=true;dirSync();renderFind()}else if((s==='CHANNEL_ERROR'||s==='TIMED_OUT')&&!dirReady&&dirMode==='find')$('f-st').textContent="Couldn't reach the lobby list. Check your connection."})}
function dirClose(){if(dir&&sb){try{sb.removeChannel(dir)}catch(e){}}dir=null;dirReady=false;dirMode='';dirLast=''}

 for(const m of L){const li=document.createElement('li'),ln=document.createElement('div'),nb=document.createElement('b'),st=document.createElement('i'),pc=document.createElement('span'),bt=document.createElement('button');

  pc.className='pc';pc.textContent=m.n+'/'+m.max;bt.textContent=m.n>=m.max?'Full':'Join';bt.disabled=m.n>=m.max;bt.onclick=()=>joinLobby(m.code);

let hudT=0;
function hud(dt){
 if(!R||R.phase!=='play')return;
 const c=me;let msg='',sub='';
 if(R.win){const left=Math.max(0,Math.ceil((R.win.at+5000+(isHost?0:-clockOff)-Date.now())/1000));if(R.win.id==='truck'){msg='Truck is totalled';sub='New round starting in '+left}else{msg=(R.win.id===myId?'You':nameOf(R.win.id))+' parked it!';sub='Next round in '+left}if(shownWin!==R.n){shownWin=R.n}}
 else if(simT<HEAD){msg=simT<0?'':String(Math.ceil(HEAD-simT));sub='Round '+R.n+': park on the trailer'}
 else if(simT<HEAD+.9)msg='GO';
 if(!R.win&&c&&c.respawnT>0)sub=(c.why==='Respawning'?'':c.why+' · ')+'Respawning in '+Math.ceil(c.respawnT);
 $('msg').textContent=msg;$('sub').textContent=sub;
 if(c){const b=$('boost'),pc=Math.round(c.boost*100);if(b._p!==pc){b._p=pc;b.style.background='conic-gradient(rgba(255,170,40,.75) '+pc+'%, rgba(10,15,20,.4) 0)';b.classList.toggle('empty',c.boost<.05)}}
 {const bm=$('bmeter');if(c&&c.boosting)c.bSeen=performance.now();const vis=c&&R&&R.phase==='play'&&c.sink===0;if(vis){_a.set(c.x-c.s*2.6,Math.max(0,c.y-c.hh),c.z-c.co*2.6).project(camera);bm.style.transform='translate('+((_a.x+1)/2*innerWidth)+'px,'+((1-_a.y)/2*innerHeight)+'px)';bm.firstChild.style.width=Math.round(c.boost*100)+'%';bm.classList.toggle('on',!!c.boosting)}bm.style.opacity=vis?1:0}
 {const b=$('item'),it=c&&c.item;if(b._it!==it){b._it=it;b.style.display=it&&!padOn?'block':'none';if(it){b.textContent=ITEM_NAME[it];b.style.borderColor=ITEM_COL[it];b.style.color=ITEM_COL[it]}}}
 let lead=null;for(const o of cars)if(o.net!=='husk'&&o.parkT>0&&(!lead||o.parkT>lead.parkT))lead=o;
 const pk=lead?lead.parkT/PARK_T:0,mine=lead===c;if(c&&c.parkBlocked&&c.parkT>0)$('sub').textContent='Another car is on the trailer: parking paused';
 $('park').style.display=pk>0&&!R.win?'block':'none';$('pk').style.width=Math.min(100,pk*100)+'%';$('pk').style.background=mine?'#35c46a':'#e8412f';

 const ids=R.order.slice().sort((a,b)=>(R.scores[b]||0)-(R.scores[a]||0));

// ---------- menu intro ----------
const INTRO={on:false,t:0,cars:[],hitT:-1,P:{x:0,z:168},cam:new THREE.Vector3()};
function logoIn(fromX,fromY){const L=$('logo');if(L.classList.contains('in')||L.classList.contains('shown'))return;const sp=[...L.querySelectorAll('span')],r=L.getBoundingClientRect();
 for(const e of sp){const b=e.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;e.style.setProperty('--fx',(fromX-cx)+'px');e.style.setProperty('--fy',(fromY-cy)+'px');e.style.setProperty('--fr',(rand(-200,200)|0)+'deg');e.style.setProperty('--d',(Math.hypot(cx-fromX,cy-fromY)/r.width*.45+rand(0,.08)).toFixed(3))}

function startIntro(){if(!physReady||INTRO.on||R)return;INTRO.on=true;INTRO.t=0;INTRO.hitT=-1;const P=INTRO.P;
 const a=makeCar('introA',randCfg(),0,'local',{x:P.x-30,z:P.z-.35,a:Math.PI/2}),b=makeCar('introB',randCfg(),0,'local',{x:P.x+30,z:P.z+.35,a:-Math.PI/2});

function introStep(dt){if(!INTRO.on)return;INTRO.t+=dt;const[a,b]=INTRO.cars;
 if(INTRO.hitT<0&&a&&b&&Math.hypot(a.x-b.x,a.z-b.z)<4.9){INTRO.hitT=INTRO.t;const v=new THREE.Vector3((a.x+b.x)/2,1,(a.z+b.z)/2).project(camera);logoIn((v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight);shake=1;const M=$('menu');M.classList.remove('jolt');void M.offsetWidth;M.classList.add('jolt');setTimeout(()=>M.classList.remove('jolt'),600)}
 if(INTRO.hitT>=0)for(const c of INTRO.cars)c.ctl={steer:0,gas:false,rev:false,hb:true,hold:false};

function introCam(dt){const P=INTRO.P,k=Math.min(1,INTRO.t/6),land=innerWidth>innerHeight;camera.position.set(P.x+3-k*2,2.6+k*.8,P.z+12-k*1.5);shake*=Math.exp(-dt*3.2);camera.position.x+=rand(-1,1)*shake*.6;camera.position.y+=rand(-1,1)*shake*.4;camera.position.z+=rand(-1,1)*shake*.3;

// ---------- loop ----------
let acc=0,last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const rdt=Math.min(.05,(now-last)/1000);last=now;
 if(R&&R.phase==='play'&&physReady){
  hostTick();truckWatch(rdt);
  pollPad();
  if(me){const P=padOn&&pad?pad:inp;me.ctl.steer=P.steer;me.ctl.gas=P.gas;me.ctl.rev=P.rev;me.ctl.hb=P.hb;me.ctl.ga=P.ga;me.ctl.ra=P.ra;me.ctl.boost=P.boost;me.ctl.hold=simT<HEAD}
  for(const c of cars)if(c.bot&&c.net==='local'){botThink(c,rdt);botItem(c,rdt)}
  cratesStep(rdt);
  acc+=rdt;let n=0;while(acc>=FIXED&&n<8){step(FIXED);acc-=FIXED;n++}if(n>=8)acc=0;
  const tt=truckTime(),corr=tt-simT;if(tt<=0||Math.abs(corr)>.5)simT=tt;else simT+=corr*.1;
  for(const c of cars.slice())if(c.net==='local'&&c.respawnT>0){if(c.parkGain||c.parkBlocked)continue;c.respawnT-=rdt;if(c.respawnT<=0)respawn(c)}

  if(INTRO.on){acc+=rdt;let n=0;while(acc>=FIXED&&n<8){for(const c of INTRO.cars)carPre(c,FIXED);world.step();for(const c of INTRO.cars)carPost(c,FIXED);acc-=FIXED;n++}if(n>=8)acc=0;introStep(rdt)}}
 sndFrame(rdt);updateFx(rdt);updateCars(rdt);updateTruckVis(rdt);updateCam(rdt);hud(rdt);netTick(rdt);
 renderer.render(scene,camera)}
truckReset(0,false);requestAnimationFrame(loop);
$('m-err').textContent='Loading physics…';
import(RAPIER_URL).then(async m=>{RAPIER=m.default||m;await RAPIER.init();buildPhysics();truckReset(0,false);startIntro();if($('m-err').textContent==='Loading physics…')$('m-err').textContent=''}).catch(e=>{console.error(e);$('m-err').textContent='Physics failed to load. Check your connection and reload.'});
setTimeout(()=>{if(!INTRO.on&&INTRO.hitT<0)logoIn(innerWidth/2,innerHeight*.3)},9000);
