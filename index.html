{const segs=[...document.querySelectorAll('#joym button')],sel=()=>{segs.forEach(b=>b.classList.toggle('sel',b.dataset.m===joyMode));$('joyh').textContent=joyMode==='fixed'?'Stick stays in the bottom-left corner.':'Stick appears wherever your left thumb touches.'};

 const open=()=>{sel();$('set').style.display='flex'};$('b-set').addEventListener('click',open);$('b-set2').addEventListener('click',open);$('b-setx').addEventListener('click',()=>$('set').style.display='none')}
$('b-reset').addEventListener('click',()=>{if(me&&!me.respawnT){me.respawnT=3;me.why='Respawning'}});
$('b-exit').addEventListener('click',()=>leave());

// ---------- rooms / net ----------
let myJoined=0,chReady=false,sb=null,ch=null,net=false,isHost=true,hostId=null,players=[],R=null,roomCode='',offS=[],clockOff=0,shownWin=0,sendAcc=0;
const myId=rid();let myName=store('pursuit_name')||('Driver'+((Math.random()*90+10)|0)),myCls=store('pursuit_car')||'1.0.0.6.0.0.0';
const BOTN=['Dusty','Rusty','Mags','Tex','Bubba','Gravel','Hank','Skid'];
const hostNow=()=>Date.now()+(isHost?0:clockOff);
const truckTime=()=>R&&R.phase==='play'?(hostNow()-R.t0)/1000:-5;
function nameOf(id){if(id===myId)return myName;const p=players.find(q=>q.id===id);if(p)return p.name;const b=R&&R.bots.find(q=>q.id===id);return b?b.name:'Driver'}
function newRoom(){return{phase:'lobby',n:0,t0:0,order:[myId],bots:[],scores:{},win:null}}
function addBot(){if(!R||players.length+R.bots.length>=8)return;const used=R.bots.map(b=>b.name),name=BOTN.find(n=>!used.includes(n))||'Bot';const b={id:'b'+rid(),name,cls:randCfg()};R.bots.push(b);R.order.push(b.id)}
function clearWorld(){for(const c of cars.slice())removeCar(c);for(const g of gibs){scene.remove(g.o);g.o.traverse(o=>{if(o.isMesh&&o.geometry)o.geometry.dispose()})}gibs.length=0;me=null}
function startRound(){
 clearWorld();simT=truckTime();if(simT<HEAD+1||!RIGN)truckReset(Math.max(0,simT),true);const late=simT>HEAD;
 me=spawnLocal(myId,myCls,late?spawnPoint():gridPoint(R.order.indexOf(myId)),false,0);
 if(isHost)for(const b of R.bots)spawnLocal(b.id,b.cls,late?spawnPoint():gridPoint(R.order.indexOf(b.id)),true,0);
 flash()}
function ensureBots(){if(!isHost||!R||R.phase!=='play')return;for(const b of R.bots){if(byId(b.id,'local'))continue;const old=byId(b.id,'remote');const life=old?old.life+1:0;if(old)huskify(old);spawnLocal(b.id,b.cls,spawnPoint(),true,life)}}
function hostTick(){if(!isHost||!R||R.phase!=='play')return;ensureBots();if(R.win&&Date.now()-R.win.at>5000){R.n++;R.t0=Date.now()+300;R.win=null;startRound()}}
function handleClaim(id,n){if(!R||R.phase!=='play'||R.win||n!==R.n||truckTime()<HEAD)return;R.win={id,n,at:Date.now()};R.scores[id]=(R.scores[id]||0)+1}
function claim(c){if(isHost)handleClaim(c.id,R.n);else if(ch&&chReady)ch.send({type:'broadcast',event:'c',payload:{id:c.id,n:R.n}})}
function applyRoom(nr){const prevN=R?R.n:-1,prevPhase=R?R.phase:'';R=nr;
 if(R.phase==='play'){if(prevPhase!=='play')enterGame();if(R.n!==prevN)startRound()}else if(prevPhase==='play'){exitGame();showRoom()}
 refreshRoom()}
function rec(c){const q=c.q;return[c.id,c.n,c.life,c.cls,c.col,r2(c.x),r2(c.y),r2(c.z),r3(q.x),r3(q.y),r3(q.z),r3(q.w),r2(c.vx),r2(c.vy),r2(c.vz),r2(c.wx),r2(c.w),r2(c.wz),Math.round(c.hp),c.wrecked?1:0,r2(c.ctl.steer)]}
function onState(p){
 if(p.rig&&p.id===hostId&&!isHost)RIGN={v:p.rig,t:performance.now()};
 if(p.room&&p.id===hostId&&!isHost){offS.push(p.hn-Date.now());if(offS.length>30)offS.shift();clockOff=Math.max(...offS);applyRoom(p.room)}
 if(!R||R.phase!=='play')return;
 for(const r of p.cars||[]){const[id,n,life,cls,col,x,y,z,qx,qy,qz,qw,vx,vy,vz,wx,wy,wz,hp,fl,steer]=r;if(n<R.n||byId(id,'local')||!physReady)continue;
  const q={x:qx,y:qy,z:qz,w:qw};
  let c=byId(id,'remote');if(c&&c.life!==life){if(life<c.life)continue;huskify(c);c=null}
  if(!c){const f=rot(q,0,0,1);c=makeCar(id,cls,col,'remote',{x,y,z,q,a:Math.atan2(f[0],f[2])});c.life=life;c.n=n;mkTag(c,nameOf(id))}
  c.snap={p:[x,y,z],q,v:[vx,vy,vz],w:[wx,wy,wz],t:performance.now()};c.hp=hp;c.wrecked=!!fl;c.steerVis=steer;c.lastSeen=performance.now()}
 for(const e of p.ev||[]){const c=byId(e[1],'remote');if(!c)continue;
  if(e[0]==='d')dentLocal(c,e[2],e[3],e[4],e[5],e[6],e[7],e[8]);
  else if(e[0]==='u')unlatch(c,c.det.find(q=>q.key===e[2]));
  else if(e[0]==='g')detach(c,c.det.find(q=>q.key===e[2]),[e[3],e[4],e[5]])}}
function onPresence(){
 const st=ch.presenceState();players=[];for(const k in st){const m=st[k][0];if(m)players.push(m)}
 players.sort((a,b)=>a.joined-b.joined||(a.id<b.id?-1:1));
 const nh=players.length?players[0].id:myId;if(nh!==hostId){hostId=nh;offS=[]}
 const was=isHost,off=clockOff;isHost=hostId===myId;
 if(isHost){if(!R)R=newRoom();else if(!was){R.t0-=off;if(R.win)R.win.at-=off;clockOff=0}
  for(const p of players)if(!R.order.includes(p.id))R.order.push(p.id);
  R.order=R.order.filter(id=>players.some(p=>p.id===id)||R.bots.some(b=>b.id===id))}
 refreshRoom()}
function netTick(dt){if(!net||!ch||!chReady)return;sendAcc+=dt;const play=R&&R.phase==='play',rate=play?1/12:1/3;if(sendAcc<rate)return;sendAcc=0;
 if(!play&&!isHost)return;
 const p={id:myId,cars:play?cars.filter(c=>c.net==='local').map(rec):[],ev:evQ.splice(0)};
 if(isHost){p.room=R;p.hn=Date.now();p.rig=rigRec(TRK).concat(rigRec(TRL),[r3(TK.steer)])}
 ch.send({type:'broadcast',event:'s',payload:p})}
function connect(code){
 if(!physReady){$('m-err').textContent='Loading physics…';return}
 if(!window.supabase){$('m-err').textContent='Online play could not load here. Try Practice.';return}
 $('m-err').textContent='Connecting…';roomCode=code;
 try{sb=sb||window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:40}}})}catch(e){$('m-err').textContent='Online play could not start. Try Practice.';return}
 ch=sb.channel('pursuit-'+code,{config:{broadcast:{self:false},presence:{key:myId}}});
 ch.on('broadcast',{event:'s'},({payload})=>onState(payload));
 ch.on('broadcast',{event:'c'},({payload})=>{if(isHost)handleClaim(payload.id,payload.n)});
 ch.on('presence',{event:'sync'},onPresence);
 let ok=false;const to=setTimeout(()=>{if(!ok){leave();$('m-err').textContent="Couldn't reach the room. Check your connection or try Practice."}},9000);
 net=true;isHost=false;R=null;hostId=null;
 ch.subscribe(s=>{if(s==='SUBSCRIBED'){ok=true;chReady=true;clearTimeout(to);$('m-err').textContent='';myJoined=Date.now();ch.track({id:myId,name:myName,cls:myCls,joined:myJoined});showRoom()}else if((s==='CHANNEL_ERROR'||s==='TIMED_OUT')&&!ok){clearTimeout(to);leave();$('m-err').textContent="Couldn't reach the room. Try Practice."}})}
function leave(){chReady=false;RIGN=null;truckReset(0,false);if(ch&&sb){try{sb.removeChannel(ch)}catch(e){}}ch=null;net=false;isHost=true;R=null;players=[];evQ=[];clearWorld();exitGame();$('m-room').style.display='none';$('m-main').style.display='block';$('menu').style.display='flex'}
function showRoom(){$('menu').style.display='flex';$('m-main').style.display='none';$('m-room').style.display='block';$('r-code').textContent=roomCode;refreshRoom()}
function refreshRoom(){if($('m-room').style.display==='none')return;const ul=$('rl');ul.innerHTML='';
 for(const p of players){const li=document.createElement('li');li.textContent=p.name+' · '+MODELS[parseCfg(p.cls).m].name+(p.id===hostId?' · host':'')+(p.id===myId?' (you)':'');ul.appendChild(li)}
 for(const b of(R?R.bots:[])){const li=document.createElement('li');li.textContent=b.name+' · '+MODELS[parseCfg(b.cls).m].name+' · bot';ul.appendChild(li)}
 $('rh').style.display=isHost?'flex':'none';$('r-wait').style.display=isHost?'none':'block'}
function enterGame(){$('menu').style.display='none';setTimeout(placeJoy,0);for(const id of['hud','joy'])$(id).style.display='block';$('tr').style.display='flex';for(const id of['gas','rev','hb'])$(id).style.display='block'}
function exitGame(){for(const id of['hud','joy','tr','gas','rev','hb','park'])$(id).style.display='none';$('msg').textContent='';$('sub').textContent='';clearWorld()}
function startPractice(){if(!physReady){$('m-err').textContent='Loading physics…';return}net=false;isHost=true;hostId=myId;players=[{id:myId,name:myName,cls:myCls,joined:0}];R=newRoom();for(let i=0;i<3;i++)addBot();R.phase='play';R.n=1;R.t0=Date.now()+300;enterGame();startRound()}
function hostStart(){if(!isHost||!R)return;R.phase='play';R.n++;R.t0=Date.now()+300;R.scores={};R.win=null;enterGame();startRound()}
{$('nm').value=myName;$('nm').addEventListener('input',()=>{myName=$('nm').value.trim().slice(0,12)||'Driver';store('pursuit_name',myName)});
 $('b-prac').addEventListener('click',startPractice);
 $('b-make').addEventListener('click',()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=A[(Math.random()*A.length)|0];connect(c)});
 $('b-join').addEventListener('click',()=>{const c=$('code').value.trim().toUpperCase();if(c.length!==4){$('m-err').textContent='Enter the 4-letter room code.';return}connect(c)});
 $('code').addEventListener('input',()=>$('m-err').textContent='');
 $('b-bot').addEventListener('click',()=>{addBot();refreshRoom()});
 $('b-unbot').addEventListener('click',()=>{if(R&&R.bots.length){const b=R.bots.pop();R.order=R.order.filter(i=>i!==b.id);refreshRoom()}});
 $('b-start').addEventListener('click',hostStart);
 $('b-leave').addEventListener('click',leave)}

// ---------- garage ----------
let garageVO=-1,garageOn=false,show=null,showA=0;const SHOW_P={x:0,z:0};
function buildShow(){if(show){scene.remove(show.g);show.g.traverse(o=>{if(o.isMesh&&o.geometry)o.geometry.dispose()})}const cfg=parseCfg(myCls),V=buildVehicle(carSpec(cfg),PAINTS[cfg.p],false,cfg);V.g.position.set(SHOW_P.x,V.hh,SHOW_P.z);scene.add(V.g);show=V;$('g-name').textContent=MODELS[cfg.m].name}
function garageUI(){const cfg=parseCfg(myCls),hx=n=>'#'+n.toString(16).padStart(6,'0');
 const seg=(id,names,key)=>{const el=$(id);el.innerHTML='';names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(cfg[key]===i)b.classList.add('sel');b.onclick=()=>setCfg(key,i);el.appendChild(b)})};
 const sw=(id,cols,key)=>{const el=$(id);el.innerHTML='';cols.forEach((c,i)=>{const b=document.createElement('button');b.style.background=hx(c);if(cfg[key]===i)b.classList.add('sel');b.setAttribute('aria-label','color '+i);b.onclick=()=>setCfg(key,i);el.appendChild(b)})};
 seg('g-m',MODELS.map(m=>m.name),'m');sw('g-p',PAINTS,'p');seg('g-s',STRIPES,'s');sw('g-sc',PAINTS,'sc');$('g-sc').style.display=cfg.s?'flex':'none';seg('g-r',RIMS,'r');sw('g-rc',RIMCOLS,'rc');seg('g-w',SPOILERS,'w')}
function setCfg(k,v){const c=parseCfg(myCls);c[k]=v;myCls=cfgStr(c);store('pursuit_car',myCls);garageUI();buildShow();if(ch&&chReady)ch.track({id:myId,name:myName,cls:myCls,joined:myJoined})}
function openGarage(){garageOn=true;$('menu').style.display='none';$('garage').style.display='block';garageUI();buildShow()}
function closeGarage(){garageOn=false;garageVO=-1;camera.clearViewOffset();camera.updateProjectionMatrix();$('garage').style.display='none';$('menu').style.display='flex';if(show){scene.remove(show.g);show=null}}
$('b-garage').addEventListener('click',openGarage);$('g-done').addEventListener('click',closeGarage);

// ---------- hud ----------
let hudT=0;
function hud(dt){
 if(!R||R.phase!=='play')return;
 const c=me;let msg='',sub='';
 if(R.win){const left=Math.max(0,Math.ceil((R.win.at+5000+(isHost?0:-clockOff)-Date.now())/1000));msg=(R.win.id===myId?'You':nameOf(R.win.id))+' parked it!';sub='Next round in '+left;if(shownWin!==R.n){shownWin=R.n}}
 else if(simT<HEAD){msg=simT<0?'':String(Math.ceil(HEAD-simT));sub='Round '+R.n+': park on the trailer'}
 else if(simT<HEAD+.9)msg='GO';
 if(!R.win&&c&&c.respawnT>0)sub=(c.why==='Respawning'?'':c.why+' · ')+'Respawning in '+Math.ceil(c.respawnT);
 $('msg').textContent=msg;$('sub').textContent=sub;
 const pk=c?c.parkT/PARK_T:0;$('park').style.display=pk>0&&!R.win?'block':'none';$('pk').style.width=Math.min(100,pk*100)+'%';
 hudT-=dt;if(hudT>0)return;hudT=.15;
 if(c){$('spd').textContent=Math.round(Math.hypot(c.vx,c.vz)*2.237)+' mph';$('hp').style.width=clamp(c.hp/c.S.hp*100,0,100)+'%';$('hp').style.background=c.hp>c.S.hp*.5?'#5dcaa5':c.hp>c.S.hp*.25?'#ef9f27':'#e24b4a'}
 const ids=R.order.slice().sort((a,b)=>(R.scores[b]||0)-(R.scores[a]||0));
 $('sc').innerHTML=ids.map(id=>'<div'+(id===myId?' class="me"':'')+'>'+(R.scores[id]||0)+'  '+nameOf(id).replace(/[<>&]/g,'')+'</div>').join('')}

// ---------- loop ----------
let acc=0,last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const rdt=Math.min(.05,(now-last)/1000);last=now;
 if(R&&R.phase==='play'&&physReady){
  hostTick();
  if(me){me.ctl.steer=inp.steer;me.ctl.gas=inp.gas;me.ctl.rev=inp.rev;me.ctl.hb=inp.hb;me.ctl.hold=simT<HEAD}
  for(const c of cars)if(c.bot&&c.net==='local')botThink(c,rdt);
  acc+=rdt;let n=0;while(acc>=FIXED&&n<8){step(FIXED);acc-=FIXED;n++}if(n>=8)acc=0;
  const tt=truckTime(),corr=tt-simT;if(tt<=0||Math.abs(corr)>.5)simT=tt;else simT+=corr*.1;
  for(const c of cars.slice())if(c.net==='local'&&c.respawnT>0){c.respawnT-=rdt;if(c.respawnT<=0)respawn(c)}
 }else if(physReady&&!rigStatic)truckReset(0,false);
 updateFx(rdt);updateCars(rdt);updateTruckVis(rdt);updateCam(rdt);hud(rdt);netTick(rdt);
 renderer.render(scene,camera)}
truckReset(0,false);requestAnimationFrame(loop);
$('m-err').textContent='Loading physics…';
import(RAPIER_URL).then(async m=>{RAPIER=m.default||m;await RAPIER.init();buildPhysics();truckReset(0,false);if($('m-err').textContent==='Loading physics…')$('m-err').textContent=''}).catch(e=>{console.error(e);$('m-err').textContent='Physics failed to load. Check your connection and reload.'});
</script>
</body></html>
